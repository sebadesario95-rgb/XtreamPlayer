name: Generate FUTURE SMART Key

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate FUTURE SMART keystore
        run: |
          keytool -genkeypair \
            -keystore future-smart.jks \
            -storepass "FutureSmart2026Key" \
            -keypass "FutureSmart2026Key" \
            -alias future-smart \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=FUTURE SMART, OU=Development, O=FUTURE SMART, L=Taranto, C=IT"

      - name: Upload FUTURE SMART keystore
        uses: actions/upload-artifact@v4
        with:
          name: FUTURE-SMART-KEYSTORE
          path: future-smart.jks
