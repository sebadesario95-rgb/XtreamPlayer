name: Build FUTURE SMART APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore FUTURE SMART signing key
        env:
          FUTURE_SMART_KEYSTORE_BASE64: ${{ secrets.FUTURE_SMART_KEYSTORE_BASE64 }}
        run: |
          echo "$FUTURE_SMART_KEYSTORE_BASE64" | base64 --decode > app/future-smart.jks

      - name: Build signed APK
        env:
          FUTURE_SMART_KEYSTORE_PATH: future-smart.jks
          FUTURE_SMART_KEYSTORE_PASSWORD: ${{ secrets.FUTURE_SMART_KEYSTORE_PASSWORD }}
          FUTURE_SMART_KEY_ALIAS: ${{ secrets.FUTURE_SMART_KEY_ALIAS }}
          FUTURE_SMART_KEY_PASSWORD: ${{ secrets.FUTURE_SMART_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FUTURE-SMART-APK
          path: app/build/outputs/apk/debug/app-debug.apk
